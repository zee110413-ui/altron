name: Mod build and release

on:
  push:
    branches: [main]
    paths: ['mod/**', '.github/workflows/mod.yml']
  pull_request:
    paths: ['mod/**', '.github/workflows/mod.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Find the jar
        id: jar
        run: |
          VERSION=$(grep '^mod_version=' mod/gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=mod/build/libs/altron-$VERSION.jar" >> "$GITHUB_OUTPUT"
          test -f "mod/build/libs/altron-$VERSION.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: altron-${{ steps.jar.outputs.version }}
          path: ${{ steps.jar.outputs.path }}

      - name: Check the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.jar.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "The release tag is $TAG, but mod_version in mod/gradle.properties is $VERSION: make them match (tag v$VERSION)."
            exit 1
          fi

      - name: Attach the jar to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          JAR: ${{ steps.jar.outputs.path }}
        run: gh release upload "$TAG" "$JAR" --clobber

      - name: Publish to Modrinth
        if: github.event_name == 'release'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          VERSION: ${{ steps.jar.outputs.version }}
          JAR: ${{ steps.jar.outputs.path }}
          CHANGELOG: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$MODRINTH_PROJECT_ID" ]; then
            echo "MODRINTH_TOKEN / MODRINTH_PROJECT_ID secrets are not set: skipping Modrinth."
            exit 0
          fi
          TYPE=release; [ "$PRERELEASE" = "true" ] && TYPE=beta
          DATA=$(jq -n --arg name "Altron $VERSION" --arg v "$VERSION" --arg log "$CHANGELOG" \
                       --arg pid "$MODRINTH_PROJECT_ID" --arg type "$TYPE" \
            '{name: $name, version_number: $v, changelog: $log, dependencies: [], game_versions: ["1.20.1"],
              version_type: $type, loaders: ["forge"], featured: true, project_id: $pid,
              file_parts: ["file"], primary_file: "file"}')
          curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: zee110413-ui/altron (GitHub Actions)" \
            -F "data=$DATA" \
            -F "file=@$JAR;type=application/java-archive"
